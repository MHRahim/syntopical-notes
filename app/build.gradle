buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.liquibase:liquibase-gradle-plugin:3.1.0"
        classpath 'org.liquibase:liquibase-core:4.31.1'
    }
}

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'eclipse'
    id 'org.springframework.boot' version '4.0.2'

    id("org.liquibase.gradle") version "3.1.0"
}

apply plugin: 'org.liquibase.gradle'
apply plugin: 'io.spring.dependency-management'



repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

configurations {
    liquibaseRuntime
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


    // This dependency is used by the application.
    implementation libs.guava
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'org.postgresql:postgresql'

    liquibaseRuntime 'org.liquibase:liquibase-core:4.25.1'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'org.liquibase:liquibase-groovy-dsl:3.0.3'
    liquibaseRuntime 'info.picocli:picocli:4.7.5'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.rahim.syntopicalnotes.SyntopicalNotes'
}

liquibase {
    activities {
        main {
            changelogFile 'src/main/resources/db/changelog/db.changelog-master.yaml'
            url 'jdbc:postgresql://localhost:5432/syntopical_notes'
            username 'admin'
            password 'test'
            driver 'org.postgresql.Driver'
        }
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

tasks.register('seed', JavaExec) {
    group = 'application'
    description = 'Run database seeding main class'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.rahim.syntopicalnotes.seeding.Seeding'

    systemProperty 'spring.profiles.active', 'seed'
}

tasks.register('beans', JavaExec) {
    group = 'application'
    description = 'List all the beans'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.rahim.syntopicalnotes.beanslist.BeansList'

    systemProperty 'spring.profiles.active', 'beanslist'
}

tasks.register('util', JavaExec) {
    group = 'application'
    description = 'Test utility'


    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.rahim.syntopicalnotes.utiltestt.Utility'

    systemProperty 'spring.profiles.active', 'utils'
}

tasks.register('dbDropAll', JavaExec) {
    group = 'database'
    classpath = configurations.liquibaseRuntime
    mainClass = 'liquibase.integration.commandline.Main'
    
    args "--url=jdbc:postgresql://localhost:5432/syntopical_notes"
    args "--username=admin"
    args "--password=test"
    
    args "--command=dropAll"
}

tasks.register('dbUpdate', JavaExec) {
    group = 'database'
    classpath = configurations.liquibaseRuntime
    mainClass = 'liquibase.integration.commandline.LiquibaseCommandLine'
    
    args "--search-path=src/main/resources" 
    args "--url=jdbc:postgresql://localhost:5432/syntopical_notes"
    args "--username=admin"
    args "--password=test"
    
    args "--changelog-file=db/changelog/db.changelog-master.yaml"
    args "update"
}

